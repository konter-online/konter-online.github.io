<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin AYSA ALFAZA</title><style>body{font:15px system-ui;background:#eaf4ff;color:#12345c;margin:0}main{max-width:860px;margin:24px auto;padding:18px}section{background:white;border:1px solid #c9ddf4;border-radius:18px;padding:20px;margin:16px 0}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #b5d4f0;box-sizing:border-box}input,select{width:100%;margin:5px 0 13px}button{background:#0877d9;color:white;border:0;cursor:pointer;margin:4px}button.secondary{background:#e7f2ff;color:#075caa}button.danger{background:#c8344b}label{font-weight:650;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 15px}.item{border-top:1px solid #d8e6f4;padding:12px 0}.item button{padding:7px 10px;font-size:13px}small{color:#58708f}#status{white-space:pre-wrap} @media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🔐 Admin AYSA ALFAZA</h1><p>Kelola katalog kuota secara langsung melalui Firebase.</p><section id="loginBox"><h2>Masuk Admin</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="login">Masuk</button></section><section id="panel" hidden><button id="logout" class="secondary">Keluar</button><h2>Tambah / Ubah Produk</h2><form id="form"><input type="hidden" id="oldId"><div class="grid"><div><label>Kode produk (unik)</label><input id="id" required placeholder="TSL10"></div><div><label>Operator</label><select id="operator"><option>Telkomsel</option><option>Indosat</option><option>XL</option><option>AXIS</option><option>Tri</option><option>Smartfren</option><option>by.U</option></select></div><div><label>Nama paket</label><input id="name" required placeholder="Kuota 10 GB"></div><div><label>Kategori</label><input id="category" placeholder="Paket Internet"></div><div><label>Kuota (GB)</label><input id="gb" type="number" step="0.01" min="0" required></div><div><label>Masa aktif (hari)</label><input id="days" type="number" min="1" required></div><div><label>Harga jual (Rp)</label><input id="price" type="number" min="0" required></div><div><label>Status</label><select id="active"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></div></div><button type="submit">Simpan Produk</button><button type="button" id="reset" class="secondary">Form Baru</button></form><h2>Daftar Produk</h2><div id="list">Memuat...</div></section><p id="status" role="status"></p><p><a href="./index.html">← Lihat katalog pembeli</a></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,doc,getDocs,setDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyBZht1cTG__sVLhP8T-6jRctG8MeOGJ7Qw',authDomain:'aysa-alfaza.firebaseapp.com',projectId:'aysa-alfaza',storageBucket:'aysa-alfaza.firebasestorage.app',messagingSenderId:'1081480695574',appId:'1:1081480695574:web:0e8704e9bdfc314fff8a37'});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let products=[];
const message=s=>$('status').textContent=s;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';message('Berhasil masuk.')}catch(e){message('Login gagal: '+e.message)}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{$('loginBox').hidden=!!user;$('panel').hidden=!user;if(user)await load();else {products=[];message('')}});
async function load(){try{const snap=await getDocs(collection(db,'products'));products=snap.docs.map(d=>({...d.data(),id:d.id}));$('list').innerHTML=products.length?products.map((p,i)=>`<div class="item"><strong>${esc(p.operator)} • ${esc(p.name)}</strong><br><small>${esc(p.id)} | Rp${Number(p.price||0).toLocaleString('id-ID')} | ${p.active?'Aktif':'Nonaktif'}</small><br><button data-edit="${i}">Edit</button><button class="danger" data-delete="${i}">Hapus</button></div>`).join(''):'Belum ada produk.';}catch(e){message('Gagal membaca produk: '+e.message)}}
$('list').onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit!==undefined){const p=products[Number(edit)];for(const k of ['id','operator','name','category','gb','days','price'])$(k).value=p[k]??'';$('oldId').value=p.id;$('active').value=String(!!p.active);window.scrollTo({top:0,behavior:'smooth'});}if(del!==undefined){const p=products[Number(del)];if(!confirm('Hapus '+p.name+'?'))return;try{await deleteDoc(doc(db,'products',p.id));message('Produk dihapus');await load()}catch(e){message('Gagal hapus: '+e.message)}}};
$('reset').onclick=()=>{$('form').reset();$('oldId').value=''};
$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value.trim();if(!/^[A-Za-z0-9_-]{1,80}$/.test(id)){message('Kode produk hanya boleh huruf, angka, _ dan -');return}const old=$('oldId').value;if(old&&old!==id){message('Kode produk tidak dapat diganti saat edit. Buat produk baru jika perlu.');return}const data={operator:$('operator').value,name:$('name').value.trim(),category:$('category').value.trim(),gb:Number($('gb').value),days:Number($('days').value),price:Number($('price').value),active:$('active').value==='true',restricted:false};try{await setDoc(doc(db,'products',id),data);message('Produk berhasil disimpan');$('form').reset();$('oldId').value='';await load()}catch(e){message('Gagal simpan: '+e.message)}};
</script></body></html>
